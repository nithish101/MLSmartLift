# Alembic CLI config. The database URL comes from DATABASE_URL (see app/migrations/env.py).
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "describe change"
#   uv run alembic check          # fails if the models and migrations disagree

[alembic]
script_location = %(here)s/app/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
