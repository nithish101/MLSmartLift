[project]
name = "smartlift"
version = "1.1.0"
description = "SmartLift API: ML-assisted strength training recommendations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
    "mlflow-skinny==3.14.0",
    "skops>=0.10",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "apscheduler>=3.10,<4",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.7",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]
loadtest = [
    "locust>=2.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70"
markers = [
    "integration: tests that need Docker (Postgres via testcontainers)",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv]
# Resolve only releases published before this date, for reproducible locks.
exclude-newer = "2026-09-27T00:00:00Z"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]
ignore = [
    "RUF001",  # "–" and "×" in user-facing strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "loadtest", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "loadtest"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["sklearn.*", "skops.*", "apscheduler.*", "locust.*", "mlflow.*", "joblib.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
# Locust ships no type information; its base classes and decorators are Any.
module = ["loadtest.locustfile"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
